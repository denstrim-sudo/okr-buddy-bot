name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - chore/lockfile-ci

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate stale lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install reproducibly
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit repaired lockfile to feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/chore/lockfile-ci'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || { git commit -m "chore: synchronize npm lockfile"; git push; }
