name: Checks

on:
  pull_request:
  push:
    branches:
      - fix/audit-versioning

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 'Install dependencies (temporary lockfile workaround)'
        run: npm install --no-package-lock
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build
